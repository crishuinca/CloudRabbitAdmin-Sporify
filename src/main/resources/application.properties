spring.application.name=rabbit-admin

# Puerto distinto a music-backend (8080)
server.port=${PORT:8081}
server.address=0.0.0.0

# RabbitMQ (mismo cluster que Sporify / EC2)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
spring.rabbitmq.virtual-host=/

